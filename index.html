<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dello Spirito Magiaro | Allevamento Bracco Ungherese (Vizsla)</title>
    <!-- Google Fonts: Playfair Display per i titoli gloriosi, Plus Jakarta Sans per i testi moderni -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300..700&display=swap" rel="stylesheet">
    <!-- FontAwesome per icone -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --bg-deep: #0a0b0d;
            --bg-card: #12141c;
            --gold-matte: #c5a059;
            --gold-bright: #f1cd8a;
            --text-light: #f8f9fa;
            --text-muted: #a0a5b5;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --border-glow: rgba(197, 160, 89, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-light);
            font-family: var(--font-sans);
            overflow-x: hidden;
            line-height: 1.7;
        }

        /* --- NAVIGAZIONE AVANZATA --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem 5%;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(10,11,13,0.95) 60%, rgba(10,11,13,0));
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-light);
            text-decoration: none;
        }
        
        .logo span {
            color: var(--gold-matte);
            font-style: italic;
        }

        .nav-container {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-item {
            position: relative;
        }

        .nav-link {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 0.5rem 0;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.3s ease;
        }

        .nav-link:hover, .nav-item:hover .nav-link {
            color: var(--gold-bright);
        }

        /* Menu a tendina (Dropdown) */
        .dropdown {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(15px);
            background-color: var(--bg-card);
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 12px;
            padding: 1rem 0;
            min-width: 240px;
            opacity: 0;
            visibility: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-item:hover .dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .dropdown a {
            color: var(--text-muted);
            text-decoration: none;
            display: block;
            padding: 0.7rem 1.5rem;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .dropdown a:hover {
            color: var(--gold-bright);
            background: rgba(197, 160, 89, 0.05);
            padding-left: 1.8rem;
        }

        /* --- HERO GLORIOSA --- */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 10%;
            position: relative;
            background: radial-gradient(circle at center, rgba(197, 160, 89, 0.12) 0%, rgba(10, 11, 13, 0) 75%);
        }

        .hero-badge {
            border: 1px solid var(--gold-matte);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--gold-bright);
            margin-bottom: 2rem;
            background: rgba(197, 160, 89, 0.03);
            margin-top: 6rem;
        }

        .hero h1 {
            font-family: var(--font-serif);
            font-size: clamp(2.8rem, 7vw, 5.5rem);
            line-height: 1.1;
            font-weight: 800;
            max-width: 1100px;
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
        }

        .hero h1 em {
            font-weight: 400;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.7);
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 650px;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        .hero-btn {
            padding: 1.2rem 3rem;
            background: linear-gradient(135deg, var(--gold-matte) 0%, #9e7b3b 100%);
            color: var(--bg-deep);
            text-decoration: none;
            font-weight: 700;
            border-radius: 4px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(197, 160, 89, 0.15);
        }

        .hero-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(197, 160, 89, 0.3);
            background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold-matte) 100%);
        }

        /* --- SEZIONE GENERICA STRUTTURATA --- */
        .section {
            padding: 8rem 8%;
            max-width: 1400px;
            margin: 0 auto;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .section-header {
            text-align: center;
            margin-bottom: 5rem;
        }

        .section-header span {
            color: var(--gold-matte);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 3px;
            font-weight: 600;
            display: block;
            margin-bottom: 0.8rem;
        }

        .section-header h2 {
            font-family: var(--font-serif);
            font-size: 3rem;
            font-weight: 700;
        }

        /* Layout a due colonne speculari */
        .grid-two-col {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 5rem;
            align-items: center;
        }

        .content-box h3 {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
            color: var(--gold-bright);
        }

        .content-box p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 1.05rem;
        }

        /* Segnaposto grafici di lusso per l'allevamento */
        .visual-container {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            height: 450px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .visual-container::before {
            content: '';
            position: absolute;
            width: 150%; height: 150%;
            background: radial-gradient(circle, rgba(197, 160, 89, 0.05) 0%, transparent 60%);
        }

        .visual-container i {
            font-size: 4.5rem;
            color: var(--gold-matte);
            margin-bottom: 1.5rem;
            z-index: 1;
        }

        .visual-container span {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-light);
            z-index: 1;
        }

        /* --- SCHEDE STANDARD DI RAZZA --- */
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .spec-item {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 2rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .spec-item:hover {
            border-color: rgba(197, 160, 89, 0.3);
            background: rgba(197, 160, 89, 0.02);
        }

        .spec-item h4 {
            font-family: var(--font-serif);
            color: var(--gold-bright);
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .spec-item h4 i {
            font-size: 1rem;
            color: var(--gold-matte);
        }

        .spec-item p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* --- FOOTER --- */
